services:
  - type: web
    name: cyepro-backend
    env: java
    rootDir: backend
    plan: free
    buildCommand: bash ./mvnw clean package -DskipTests
    startCommand: java -jar target/cyepro-stack2-0.0.1-SNAPSHOT.jar
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
