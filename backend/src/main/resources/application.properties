spring.application.name=cyepro-stack2

# Database configuration – Supabase PostgreSQL (session pooler, IPv4-friendly)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.llvedrcxpocdpguhxkql}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server Port
server.port=5000

# Jackson JSON configuration – frontend uses snake_case
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP tuned for Supabase pooler
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# AI Configuration (GROQ API)
ai.api.key=REDACTED_KEY
ai.api.url=https://api.groq.com/openai/v1/chat/completions
ai.model=llama-3.3-70b-versatile

# Supabase Configuration
supabase.url=https://llvedrcxpocdpguhxkql.supabase.co
supabase.service-role-key=REDACTED_SERVICE_KEY
supabase.jwt-secret=REDACTED_JWT_SECRET

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.aiService.register-health-indicator=true
resilience4j.circuitbreaker.instances.aiService.sliding-window-size=10
resilience4j.circuitbreaker.instances.aiService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.aiService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.aiService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.aiService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.aiService.failure-rate-threshold=50

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Disable Spring Security's default generated-password user (Supabase JWT handles auth)
spring.security.user.name=disabled
spring.security.user.password=disabled
